[project]
name = "python-threadsafe-serial"
description = "A serial port manager, allowing concurrent connections to a serial port instance"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { email = "matthew@davidson.engineering", name = "Matthew Davidson" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["pyserial>=3.1"]  # cancel_read/cancel_write

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/threadsafe_serial"]

[dependency-groups]
dev = ["pytest>=7.1.1", "pytest-cov>=5.0.0", "coverage>=7.0", "flake8>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A crash in a background thread must fail the test, not just print a traceback
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["src/threadsafe_serial"]

[tool.coverage.report]
show_missing = true
skip_covered = true
