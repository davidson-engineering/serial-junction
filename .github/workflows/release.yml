name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-alpha.5"]
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync
    - name: Lint with flake8
      run: |
        uv run flake8 src/ tests/ main.py --count --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: uv run pytest --cov --cov-report=term-missing

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # hatch-vcs derives the version from the tag
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"
    - name: Build package
      run: uv build
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/serial-junction
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: dist/*
